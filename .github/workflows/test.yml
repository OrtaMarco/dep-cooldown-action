name: Test the action

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clean-lockfile-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: audit
        uses: ./
        with:
          working-directory: test/fixtures/ms
          min-age-days: 7
      - name: Expect pass
        run: test "${{ steps.audit.outputs.result }}" = "pass"

  too-new-lockfile-fails:
    # A threshold of 100 years makes every real release "too new", deterministically.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          working-directory: test/fixtures/ms
          min-age-days: 36500
      - name: Expect the action to have failed
        run: |
          test "${{ steps.audit.outcome }}" = "failure"
          test "${{ steps.audit.outputs.result }}" = "fail"
          test "${{ steps.audit.outputs.young-count }}" = "1"

  ignore-accepts-exception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: audit
        uses: ./
        with:
          working-directory: test/fixtures/ms
          min-age-days: 36500
          ignore: |
            ms@2.1.3 # accepted in this fixture
      - name: Expect pass with one exception
        run: |
          test "${{ steps.audit.outputs.result }}" = "pass"
          test "${{ steps.audit.outputs.ignored-count }}" = "1"

  rejects-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: audit
        uses: ./
        continue-on-error: true
        with:
          working-directory: test/fixtures/ms
          version: latest
      - name: Expect the unpinned version to be refused
        run: test "${{ steps.audit.outcome }}" = "failure"
